<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランキングページ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #scores {
            margin-top: 20px;
        }
        .score {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>ランキング</h1>
    
    <form id="score-form">
        <input type="text" id="username" placeholder="ユーザー名" required />
        <input type="number" id="score" placeholder="スコア" required />
        <button type="submit">スコアを追加</button>
    </form>

    <h2>トップランキング</h2>
    <div id="scores"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script>
        // SQL.jsの初期化
        async function init() {
            const SQL = await initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            });

            let db;

            // localStorageにデータベースがあればそれをロード、なければ新規作成
            if (localStorage.getItem('scoresDB')) {
                const binaryArray = new Uint8Array(atob(localStorage.getItem('scoresDB')).split("").map(char => char.charCodeAt(0)));
                db = new SQL.Database(binaryArray);
            } else {
                db = new SQL.Database();
                db.run(`
                    CREATE TABLE IF NOT EXISTS scores (
                        id INTEGER PRIMARY KEY AUTOINCREMENT,
                        username TEXT NOT NULL,
                        score INTEGER NOT NULL,
                        created_at TEXT DEFAULT CURRENT_TIMESTAMP
                    );
                `);
            }

            // 既存のスコアを表示
            renderScores(db);

            // イベントリスナーを設定
            document.getElementById("score-form").addEventListener("submit", event => addScore(event, db));
        }

        // スコアを追加
        function addScore(event, db) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const score = parseInt(document.getElementById("score").value.trim(), 10);

            if (username && score) {
                db.run("INSERT INTO scores (username, score) VALUES (?, ?)", [username, score]);
                renderScores(db);
                saveDatabase(db);  // データベースを保存
                document.getElementById("score-form").reset();
            }
        }

        // ランキングを表示
        function renderScores(db) {
            const scoresContainer = document.getElementById("scores");
            scoresContainer.innerHTML = "";

            // スコアを降順で取得
            const results = db.exec("SELECT * FROM scores ORDER BY score DESC LIMIT 10");

            if (results.length > 0) {
                const rows = results[0].values;
                rows.forEach(([id, username, score, createdAt]) => {
                    const scoreDiv = document.createElement("div");
                    scoreDiv.className = "score";
                    scoreDiv.innerHTML = `
                        <p><strong>${username}</strong>: ${score} points</p>
                        <small>${new Date(createdAt).toLocaleString()}</small>
                    `;
                    scoresContainer.appendChild(scoreDiv);
                });
            }
        }

        // データベースをlocalStorageに保存
        function saveDatabase(db) {
            const binaryArray = db.export();
            const base64 = btoa(String.fromCharCode(...new Uint8Array(binaryArray)));
            localStorage.setItem('scoresDB', base64);
        }

        // 初期化関数を呼び出し
        init();
    </script>
</body>
</html>
