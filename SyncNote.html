<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shouの個人開発室</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont;
margin:0;
background:#f4f8ff;
color:#333;
}

/* ヘッダー */

header{
background:linear-gradient(135deg,#4facfe,#00c6ff);
color:white;
text-align:center;
padding:40px 20px;
}

header h1{
margin:0;
font-size:32px;
}

nav{
margin-top:15px;
}

nav a{
color:white;
margin:0 12px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
opacity:0.8;
}

/* コンテナ */

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

/* セクション */

section{
margin-bottom:40px;
}

h2{
border-left:5px solid #4facfe;
padding-left:10px;
}

/* アプリカード */

.apps{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.app-card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
text-align:center;
}

.app-card img{
width:120px;
border-radius:20px;
margin-bottom:10px;
}

.app-card h3{
margin:10px 0;
}

.button{
display:inline-block;
margin-top:10px;
padding:8px 14px;
background:#4facfe;
color:white;
border-radius:6px;
text-decoration:none;
font-size:14px;
}

.button:hover{
background:#2d8cf0;
}

/* フッター */

footer{
text-align:center;
padding:20px;
color:#777;
font-size:14px;
}

/* スマホ */

@media(max-width:600px){

header h1{
font-size:24px;
}

.container{
padding:20px;
}

}

</style>

</head>

<body>

<header>
<h1>🚀 shouの個人開発室</h1>


</header>


<div class="container">

</div>


<footer>

© 2026 shouの個人開発室

</footer>

</body>
</html>
