<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>開発アプリ一覧 - shouの開発室</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
    }

    header {
      background-color: #333;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .app-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .app-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }

    .app-card img {
      width: 100%;
      border-radius: 6px;
      object-fit: cover;
      height: 150px;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 0.8rem 0 0.5rem;
    }

    .app-description {
      flex: 1;
    }

    .app-link {
      margin-top: 1rem;
      text-align: right;
    }

    .app-link a {
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #222;
      color: #ccc;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>shouの開発アプリ一覧</h1>
  </header>

  <main>
    <h2>📱 開発したアプリ</h2>
    <div class="app-list">

      <div class="app-card">
        <img src="screen.png" alt="アプリ1の画像" />
        <div class="app-title">ファイル整理アプリ</div>
        <div class="app-description">ドラッグ＆ドロップでファイルをフォルダごとに整理できるWindowsアプリ。</div>
        <div class="app-link"><a href="app_index1.html" target="_blank">▶ 詳しく見る</a></div>
      </div>

      <div class="app-card">
        <img src="screen2.png" alt="アプリ3の画像" />
        <div class="app-title">Chrome拡張「画像ゲッター」</div>
        <div class="app-description">表示中のページからすべての画像URLを抽出し、一括保存できるChrome拡張。</div>
        <div class="app-link"><a href="chromeapp.html" target="_blank">▶ 詳しく見る</a></div>
      </div>

      <!-- ✅ ここから追加 -->
      <div class="app-card">
        <img src="editor_screen.png" alt="テキストエディタの画像" />
        <div class="app-title">テキストエディタ for Windows</div>
        <div class="app-description">
          軽量・シンプルで高機能。プログラミングにも日常使いにも対応した日本語対応のWindows用テキストエディタです。<br>
          シンタックスハイライト、文字コード選択、テーマ切り替えなどに対応。
        </div>
        <div class="app-link"><a href="app_index1.html" target="_blank">▶ 詳しく見る</a></div>
      </div>

    </div>
  </main>

  <footer>
    &copy; 2025 shouの開発室
  </footer>
</body>
</html>
