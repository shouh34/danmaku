<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おしゃれなコメントページ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>コメントページ</h1>
            <p>自由にコメントを残してください！</p>
        </header>
        <main>
            <form id="comment-form" class="form">
                <input type="text" id="username" class="input" placeholder="名前を入力" required>
                <textarea id="message" class="textarea" placeholder="コメントを入力" required></textarea>
                <button type="submit" class="button">投稿する</button>
            </form>
            <hr>
            <div id="comments" class="comments-container">
                <!-- コメントがここに表示されます -->
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="come.js"></script>
</body>
</html>
